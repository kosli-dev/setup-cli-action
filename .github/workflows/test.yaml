name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        version: ["2.11.27", "2", "2.11", "latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install deps and build
        run: npm ci && npm run build

      - name: Run unit tests
        run: npm test

      - name: Setup kosli CLI
        id: setup
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Capture kosli version installed
        run: |
          export KOSLI_VERSION=$( kosli version --short)
          echo 'KOSLI_VERSION_INSTALLED<<EOF' >> $GITHUB_ENV
          kosli version --short >> $GITHUB_ENV
          echo "\n" >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

      - name: Verify pinned version
        if: matrix.version != 'latest'
        shell: python
        env:
          KOSLI_VERSION_EXPECTED: ${{ matrix.version }}
        run: |
          import os, sys
          expected = os.environ["KOSLI_VERSION_EXPECTED"].strip()
          installed = os.environ["KOSLI_VERSION_INSTALLED"].strip().splitlines()[0].strip()
          # `kosli version --short` prints a leading "v" (e.g. v2.11.27); normalise it.
          if installed.startswith("v"):
              installed = installed[1:]
          # Exact pin: installed must equal it. Major/minor pin (e.g. "2" or "2.11"):
          # installed must sit inside that line, which also proves we never crossed
          # into a higher major.
          ok = installed == expected or installed.startswith(expected + ".")
          if not ok:
              print(f"expected version {expected!r}, but installed {installed!r}")
              sys.exit(1)

      - name: Verify latest resolved to a semver
        if: matrix.version == 'latest'
        shell: python
        env:
          KOSLI_VERSION_RESOLVED: ${{ steps.setup.outputs.version }}
        run: |
          import os, re, sys
          installed = os.environ["KOSLI_VERSION_INSTALLED"].strip()
          resolved = os.environ["KOSLI_VERSION_RESOLVED"].strip()
          if not re.match(r"^\d+\.\d+\.\d+", resolved):
              print(f"resolved version {resolved!r} does not look like semver")
              sys.exit(1)
          if resolved not in installed:
              print(f"resolved {resolved!r} not found in installed {installed!r}")
              sys.exit(1)

  attest-docker:
    name: Attest docker artifact (integration)
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      KOSLI_ORG: dummy-org
      KOSLI_FLOW: dummy-flow
      KOSLI_TRAIL: dummy-trail
      KOSLI_API_TOKEN: dummy-token
      KOSLI_DRY_RUN: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install deps and build
        run: npm ci && npm run build

      - name: Setup kosli CLI with docker attestation
        uses: ./
        with:
          attest-docker-artifact: true

      - name: docker resolves to the shim
        run: |
          resolved=$(command -v docker)
          [[ "$resolved" == "$RUNNER_TEMP"/kosli-docker-shim-*/docker ]] || { echo "docker is $resolved, not the shim"; exit 1; }

      - name: docker push attests the pushed tag
        run: |
          docker build -f test/integration/Dockerfile -t localhost:5000/kosli-shim-it:push .
          docker push localhost:5000/kosli-shim-it:push 2>&1 | tee push.log
          grep -q "kosli-shim: attesting localhost:5000/kosli-shim-it:push as 'kosli-shim-it'" push.log
          grep -q "kosli-shim: attested localhost:5000/kosli-shim-it:push" push.log

      - name: docker buildx build --push attests the pushed tag
        run: |
          docker buildx build --push -t localhost:5000/kosli-shim-it:bx -f test/integration/Dockerfile . 2>&1 | tee bx.log
          grep -q "kosli-shim: attested localhost:5000/kosli-shim-it:bx" bx.log

      - name: a build without --push does not attest
        run: |
          docker build -t localhost:5000/kosli-shim-it:nopush -f test/integration/Dockerfile . 2>&1 | tee nopush.log
          ! grep -q "kosli-shim: attest" nopush.log
